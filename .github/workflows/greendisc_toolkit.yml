name: Green DiSC toolkit

on:
  push:
    branches: [main, greendisc-toolkit]
    paths: ["greendisc_toolkit/**", ".github/workflows/greendisc_toolkit.yml"]
  pull_request:
    paths: ["greendisc_toolkit/**", ".github/workflows/greendisc_toolkit.yml"]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: greendisc_toolkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  # Run the action itself, as a caller would.
  sync_criteria:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        track: [RG, CT, RCI]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./greendisc_toolkit/sync_criteria
        with:
          track: ${{ matrix.track }}
          output: criteria-${{ matrix.track }}.yml
      - run: cat "criteria-${{ matrix.track }}.yml"
