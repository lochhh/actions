name: 'Green DiSC: save record'
description: 'Save a Green DiSC record issue (Markdown tables) to CSV files on `/save`, and flag unsaved edits.'

inputs:
  data-dir:
    description: 'Directory for the CSV files.'
    required: false
    default: 'data'
  token:
    description: 'Token with contents: write and issues: write.'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'

    # Issue content is untrusted: it only reaches the script through env and files.
    - name: Handle record issue
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        DATA_DIR: ${{ inputs.data-dir }}
        EVENT: ${{ github.event_name }}
        ACTION: ${{ github.event.action }}
        BODY_CHANGED: ${{ github.event.changes.body && 'true' || '' }}
        LABELS: ${{ toJSON(github.event.issue.labels.*.name) }}
        ISSUE: ${{ github.event.issue.number }}
        AUTHOR: ${{ github.event.issue.user.login }}
        ASSIGNEE: ${{ github.event.issue.assignees[0].login }}
        BODY: ${{ github.event.issue.body }}
        BRANCH: ${{ github.event.repository.default_branch }}
        COMMENT: ${{ github.event.comment.body }}
        COMMENTER: ${{ github.event.comment.user.login }}
      run: |
        # A comment must be exactly /save (surrounding whitespace allowed).
        if [ "$EVENT" = issue_comment ] && ! [[ "$COMMENT" =~ ^[[:space:]]*/save[[:space:]]*$ ]]; then
          echo "Comment is not /save; nothing to do."
          exit 0
        fi
        # Title-only edits change nothing to save.
        if [ "$ACTION" = edited ] && [ -z "$BODY_CHANGED" ]; then
          echo "Body not changed; nothing to do."
          exit 0
        fi
        script="$GITHUB_ACTION_PATH/save_record.py"
        body_file="$RUNNER_TEMP/record-body.md"
        message="$RUNNER_TEMP/record-message.md"
        reply="$RUNNER_TEMP/record-reply.md"
        printf '%s' "$BODY" > "$body_file"

        kind=$(python "$script" kind --body-file "$body_file")
        if [ -z "$kind" ]; then
          echo "Not a Green DiSC record; nothing to do."
          exit 0
        fi
        label="$kind-record"
        unsaved="unsaved changes"
        # Templates don't copy labels, so make sure ours exist.
        gh label create "$label" --color 2E7D32 --description "Green DiSC $kind record" --force > /dev/null
        gh label create "$unsaved" --color FBCA04 --description "Green DiSC record edited since its last /save" --force > /dev/null

        # One record per person (personal) or per repository (group): only the
        # oldest labelled one counts.
        # A record's owner is its assignee (records created by a review are
        # assigned to their owner), or else whoever created it.
        owner="${ASSIGNEE:-$AUTHOR}"
        owner_of='(.assignees[0].login // .author.login)'
        filter='.[] | select(.number < $n)'
        if [ "$kind" = personal ]; then filter+=" | select($owner_of == \$o)"; fi
        older=$(gh issue list --label "$label" --state all --limit 500 \
          --json number,author,assignees \
          | jq -r --argjson n "$ISSUE" --arg o "$owner" "$filter | .number" | sort -n | head -n 1)

        if [ "$ACTION" = edited ]; then
          # Only edits to the record itself count, not to duplicates or to
          # issues that merely look like a record.
          if [ -n "$older" ] || ! jq -e --arg l "$label" 'index($l)' <<< "$LABELS" > /dev/null; then
            echo "Not a saved record; nothing to do."
            exit 0
          fi
          gh issue edit "$ISSUE" --add-label "$unsaved"
          exit 0
        fi

        if [ -n "$older" ]; then
          gh issue comment "$ISSUE" --body "Not saved: the $kind record is #$older. Please edit that one instead."
          exit 0
        fi

        # author_association lets read-only members through, so check the
        # commenter's actual role: owners with write access can save their own
        # personal record; the group record and other people's records need
        # maintain or admin (the representative), who checks them first.
        role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" -q .role_name || echo none)
        case "$role" in
          admin|maintain) ;;
          write)
            if [ "$kind" = group ]; then
              denied="the Green DiSC representative reviews and saves the group record. Your edits are kept and marked \`unsaved changes\` until then"
            elif [ "$COMMENTER" != "$owner" ]; then
              denied="only @$owner (the record's owner) or the Green DiSC representative can save this record"
            fi ;;
          *) denied="saving needs write access to this repository; ask the Green DiSC representative" ;;
        esac
        if [ -n "${denied:-}" ]; then
          gh issue comment "$ISSUE" --body "Not saved: $denied."
          exit 0
        fi
        gh issue edit "$ISSUE" --add-label "$label" > /dev/null

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        status=""
        # Retry on a rejected push: re-apply this record on the latest branch.
        for attempt in 1 2 3 4 5; do
          git fetch -q origin "$BRANCH"
          git reset -q --hard "origin/$BRANCH"
          if ! python "$script" save --body-file "$body_file" --issue "$ISSUE" \
              --data-dir "$DATA_DIR" --message-file "$message"; then
            {
              echo "Couldn't save this record, so nothing was changed. Please fix:"
              echo
              cat "$message"
              printf '\n\n'
              echo "Then edit this issue and comment \`/save\` again."
            } > "$reply"
            gh issue comment "$ISSUE" --body-file "$reply"
            exit 0
          fi
          git add "$DATA_DIR"
          if git diff --cached --quiet; then
            status="No changes since the last save."
            break
          fi
          git commit -q -m "Save Green DiSC record #$ISSUE"
          if git push -q origin "HEAD:$BRANCH"; then
            status="Saved in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$(git rev-parse HEAD)."
            break
          fi
          sleep $((attempt * 2))
        done
        if [ -z "$status" ]; then
          echo "::error::Could not push after 5 attempts"
          exit 1
        fi
        {
          echo "$status"
          echo
          cat "$message"
          printf '\n\n'
          echo "Keep this issue open: to change this record, edit it and comment \`/save\` again."
        } > "$reply"
        gh issue comment "$ISSUE" --body-file "$reply"
        gh issue edit "$ISSUE" --remove-label "$unsaved"

        # Tick this record's lines in open review check-ins, and close a
        # check-in once all its tracked lines are ticked.
        { gh issue list --label check-in --state open --limit 500 --json number,body || echo '[]'; } \
          | jq -c --arg m "<!-- record:$ISSUE -->" '.[] | select(.body | contains($m))' \
          | while read -r check_in; do
              number=$(jq -r .number <<< "$check_in")
              jq -r .body <<< "$check_in" > "$RUNNER_TEMP/check-in.md"
              state=$(python "$script" tick --body-file "$RUNNER_TEMP/check-in.md" --issue "$ISSUE")
              gh issue edit "$number" --body-file "$RUNNER_TEMP/check-in.md"
              if [ "$state" = complete ]; then
                gh issue close "$number" --reason completed --comment "Done: record #$ISSUE saved."
              fi
            done
